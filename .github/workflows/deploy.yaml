name: Deploy dh1542.github.io site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Debug npm / next
        run: |
          echo "PWD:"
          pwd

          echo "Files:"
          ls -la

          echo "package.json scripts/deps:"
          node -e "const p=require('./package.json'); console.log({scripts:p.scripts, dependencies:p.dependencies, devDependencies:p.devDependencies})"

          echo "npm / node:"
          node -v
          npm -v

          echo "next dependency:"
          npm ls next || true

          echo "next binary:"
          ls -la node_modules/.bin/next || true

          echo "PATH:"
          echo "$PATH"

      - name: Build static export
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4